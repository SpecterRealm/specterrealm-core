plugins {
    id 'java'
    id 'net.neoforged.gradle.userdev' version '7.0.145'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }

    client { }
    server { }
}

dependencies {
    implementation "net.neoforged:neoforge:${neoforge_version}"
}

tasks.register('validateResources') {
    group = 'verification'
    description = 'Validates all JSON resource files are well-formed'
    inputs.dir('src/main/resources')
    doLast {
        def failures = []
        fileTree('src/main/resources').include('**/*.json').each { File f ->
            try {
                new groovy.json.JsonSlurper().parse(f)
            } catch (Exception e) {
                failures << "${projectDir.toPath().relativize(f.toPath())}: ${e.message}"
            }
        }
        if (failures) {
            throw new GradleException("Invalid JSON in resource files:\n  ${failures.join('\n  ')}")
        }
    }
}

tasks.named('check').configure {
    dependsOn('validateResources')
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        minecraft_version: minecraft_version,
        neoforge_version : neoforge_version,
        mod_version      : mod_version,
        mod_id           : mod_id,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : project.mod_id,
            'Specification-Vendor'    : 'SpecterRealm',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : 'SpecterRealm',
        ])
    }
}
