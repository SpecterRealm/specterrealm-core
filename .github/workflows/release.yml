name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    # GitHub-hosted on purpose: this repo is public, and the homelab runner must never serve a public
    # repo (fork PR code would run on the LAN; homelab-infra docs/runbooks/actions-runner-routing.md).
    # Vault is LAN-only, so the key comes from the CURSEFORGE_API_KEY Actions secret, which
    # platform-bootstrap writes from Vault homelab/curseforge/api-key (field token).
    # Pinned on purpose: ubuntu-latest moves to Ubuntu 26 (CP-373).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Load CurseForge API key
        id: cf_key
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: bash scripts/ci_load_curseforge_api_key.sh

      - name: Parse version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.8'

      - name: Build
        run: gradle build -Pmod_version=${{ steps.version.outputs.version }}

      - name: Locate release JAR
        id: jar
        run: |
          JAR=$(ls -1 build/libs/specterrealm-*.jar | grep -v -- '-sources\|-javadoc' | head -1)
          test -n "$JAR"
          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          echo "Built: $JAR"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "SpecterRealm Core ${{ steps.version.outputs.tag }}"
          files: ${{ steps.jar.outputs.path }}
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Upload to CurseForge
        if: steps.cf_key.outputs.configured == 'true'
        run: |
          PROJECT_ID="${{ vars.CURSEFORGE_PROJECT_ID }}"
          if [ -z "$PROJECT_ID" ]; then
            PROJECT_ID="1564254"
          fi
          python3 scripts/curseforge_upload.py \
            --project-id "$PROJECT_ID" \
            --file "${{ steps.jar.outputs.path }}" \
            --version "${{ steps.version.outputs.version }}" \
            --changelog "SpecterRealm Core ${{ steps.version.outputs.version }}" \
            --project-type mod \
            --minecraft-version 1.21.1 \
            --loaders NeoForge
