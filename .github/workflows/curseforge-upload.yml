name: CurseForge Upload

on:
  workflow_dispatch:
    inputs:
      version:
        description: Mod version (must match a built specterrealm-{version}.jar)
        required: true
        type: string
      dry_run:
        description: Dry run — load the key, build and resolve CF game versions, but do not upload
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  upload:
    # GitHub-hosted on purpose: this repo is public, and the homelab runner must never serve a public
    # repo (fork PR code would run on the LAN; homelab-infra docs/runbooks/actions-runner-routing.md).
    # Vault is LAN-only, so the key comes from the CURSEFORGE_API_KEY Actions secret, which
    # platform-bootstrap writes from Vault homelab/curseforge/api-key (field token).
    # Pinned on purpose: ubuntu-latest moves to Ubuntu 26 (CP-373).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Load CurseForge API key
        id: cf_key
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: bash scripts/ci_load_curseforge_api_key.sh --required

      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.8'

      - name: Build
        run: gradle build -Pmod_version=${{ inputs.version }}

      - name: Upload to CurseForge${{ inputs.dry_run && ' (dry run)' || '' }}
        run: |
          PROJECT_ID="${{ vars.CURSEFORGE_PROJECT_ID }}"
          if [ -z "$PROJECT_ID" ]; then
            PROJECT_ID="1564254"
          fi
          JAR=$(ls -1 build/libs/specterrealm-*.jar | grep -v -- '-sources\|-javadoc' | head -1)
          python3 scripts/curseforge_upload.py \
            --project-id "$PROJECT_ID" \
            --file "$JAR" \
            --version "${{ inputs.version }}" \
            --changelog "SpecterRealm Core ${{ inputs.version }}" \
            --project-type mod \
            --minecraft-version 1.21.1 \
            --loaders NeoForge \
            ${{ inputs.dry_run && '--dry-run' || '' }}
